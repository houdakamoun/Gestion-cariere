services:
  db:
    image: mysql:8.0
    container_name: career-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-career_platform}
      MYSQL_USER: ${MYSQL_USER:-career}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-careerpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: career-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-career}:${MYSQL_PASSWORD:-careerpassword}@db:3306/${MYSQL_DATABASE:-career_platform}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RUN_SEED: ${RUN_SEED:-false}
    # Port 3000 optionnel (debug). L'app web passe par le frontend :8080.
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    expose:
      - "3000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vide = requêtes relatives via http://localhost:8080 (proxy Nginx)
        API_URL: ${API_URL:-}
        FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    container_name: career-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  mysql_data:
  backend_uploads:
