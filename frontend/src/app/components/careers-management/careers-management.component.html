<div class="container">
  <h2 class="title">Career Management</h2>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading">Loading statistics...</div>

  <!-- STATS -->
  <div class="stats-container" *ngIf="!loading">
    <div class="stat-card">
      <mat-icon>group</mat-icon>
      <h2>{{ stats?.employees }}</h2>
      <p>Employees</p>
    </div>

    <div class="stat-card">
      <mat-icon>business</mat-icon>
      <h2>{{ stats?.departments }}</h2>
      <p>Departments</p>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <div class="action-card" routerLink="/career-list">
      <mat-icon>list</mat-icon>
      <h3>Career List</h3>
      <p>View and manage all careers</p>
    </div>
  </div>
</div>
