<div class="container">
  <h2>Employees Salary</h2>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Position</th>
        <th>Department</th>
        <th>Salary</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.nom }} {{ u.prenom }}</td>
        <td>{{ u.position }}</td>
        <td>{{ u.department }}</td>
        <td>{{ u.salary }} DT</td>
      </tr>
    </tbody>
  </table>
</div>
